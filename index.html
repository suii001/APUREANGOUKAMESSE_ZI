<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Буンカー - E2EE Direct Message</title>
  <style>
    :root {
      --bg-dark: #100505; --bg-panel: #1b0a0a; --bg-msg: #2a0f0f;
      --accent-red: #8b0000; --text-main: #f0f0f0; --text-muted: #a08080;
      --border-color: #3d1414;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .app-container { background-color: var(--bg-panel); width: 100%; max-width: 850px; height: 100vh; display: flex; border: 1px solid var(--border-color); overflow: hidden; }
    .sidebar { width: 280px; background-color: var(--bg-dark); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .user-profile-header { padding: 14px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
    .my-name { font-weight: bold; color: #ff8080; font-size: 14px; }
    .add-dm-box { display: flex; gap: 6px; }
    .add-dm-box input { flex: 1; padding: 6px 8px; font-size: 12px; }
    .dm-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .dm-item { padding: 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1a0808; cursor: pointer; }
    .dm-item:hover, .dm-item.active { background-color: #2a0c0c; }
    .chat-main { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-panel); }
    .chat-header { padding: 12px 16px; background-color: var(--bg-dark); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; color: #ff4d4d; font-size: 14px; font-weight: bold; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .message-item { display: flex; gap: 12px; align-items: flex-start; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background-color: var(--accent-red); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; }
    .message-content { flex: 1; }
    .message-meta { display: flex; gap: 8px; margin-bottom: 4px; font-size: 11px; }
    .username { color: #ff8080; font-weight: bold; }
    .timestamp { color: var(--text-muted); }
    .message-body { background-color: var(--bg-msg); padding: 8px 12px; border-radius: 8px; font-size: 13px; word-break: break-all; border: 1px solid var(--border-color); display: inline-block; }
    .chat-input-area { padding: 12px; background-color: var(--bg-dark); border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
    input, button, textarea { background-color: var(--bg-panel); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 10px; border-radius: 6px; font-size: 13px; outline: none; }
    textarea { flex: 1; height: 42px; resize: none; }
    button { background-color: var(--accent-red); font-weight: bold; cursor: pointer; }
    button:hover { opacity: 0.8; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-box { background-color: var(--bg-panel); border: 1px solid var(--border-color); padding: 24px; border-radius: 12px; width: 90%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
    @media (max-width: 600px) {
      .sidebar { width: 100%; display: flex; }
      .chat-main { display: none; width: 100%; }
      .app-container.mobile-chat-active .sidebar { display: none; }
      .app-container.mobile-chat-active .chat-main { display: flex; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="color: #ff4d4d;">ユーザー名を設定</h3>
      <input type="text" id="my-username-input" placeholder="例: user01">
      <button type="button" id="login-btn">チャット開始</button>
    </div>
  </div>

  <div class="app-container" id="app-container">
    <!-- サイドバー -->
    <div class="sidebar">
      <div class="user-profile-header">
        <div class="my-name" id="my-name-display">ID: ---</div>
        <div class="add-dm-box">
          <input type="text" id="target-user-input" placeholder="相手のID">
          <button type="button" id="add-dm-btn">追加</button>
        </div>
      </div>
      <div class="dm-list" id="dm-list"></div>
    </div>

    <!-- チャット画面 -->
    <div class="chat-main">
      <div class="chat-header">
        <span id="current-chat-title">DM相手を選択してください</span>
      </div>
      <div class="chat-messages" id="message-list">
        <div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">
          相手を追加してチャットを開始
        </div>
      </div>
      <div class="chat-input-area">
        <textarea id="msg-input" placeholder="メッセージ (E2EE暗号化)..." disabled></textarea>
        <button id="send-btn" type="button" style="width: 70px;" disabled>送信</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyBnVBvyE8pfFc4WUAbAtCJXScsWWRmhzwk",
      authDomain: "apure-chat-9e687.firebaseapp.com",
      databaseURL: "https://apure-chat-9e687-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "apure-chat-9e687",
      storageBucket: "apure-chat-9e687.firebasestorage.app",
      messagingSenderId: "119464225734",
      appId: "1:119464225734:web:593e59a957c9d6a669e0c7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myUsername = '';
    let myKeyPair = null;
    let activeTargetUser = null;
    let activeSharedKey = null;
    let currentDmRef = null;

    // --- 暗号化関連の関数 ---
    async function generateKeys() {
      return await window.crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
    }
    async function exportKey(key, format) {
      const exported = await window.crypto.subtle.exportKey(format, key);
      return btoa(String.fromCharCode(...new Uint8Array(exported)));
    }
    async function importPublicKey(base64) {
      const binary = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      return await window.crypto.subtle.importKey("spki", binary, { name: "ECDH", namedCurve: "P-256" }, false, []);
    }
    async function importPrivateKey(base64) {
      const binary = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      return await window.crypto.subtle.importKey("pkcs8", binary, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    }
    async function deriveSharedKey(privKey, pubKey) {
      return await window.crypto.subtle.deriveKey({ name: "ECDH", public: pubKey }, privKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    }
    async function encryptText(text, key) {
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const enc = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(text));
      const combined = new Uint8Array(12 + enc.byteLength);
      combined.set(iv, 0); combined.set(new Uint8Array(enc), 12);
      return btoa(String.fromCharCode(...combined));
    }
    async function decryptText(base64, key) {
      const data = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      const dec = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(0,12) }, key, data.slice(12));
      return new TextDecoder().decode(dec);
    }

    // --- 自動ログイン処理 ---
    window.addEventListener('DOMContentLoaded', async () => {
      const savedUser = localStorage.getItem('bunker_my_username');
      const savedPriv = localStorage.getItem('bunker_my_privkey');
      if (savedUser && savedPriv) {
        try {
          myUsername = savedUser;
          myKeyPair = { privateKey: await importPrivateKey(savedPriv) };
          document.getElementById('login-modal').style.display = 'none';
          document.getElementById('my-name-display').textContent = `ID: @${myUsername}`;
        } catch(e) { console.error("Key load failed"); }
      }
    });

    // --- 1. 新規登録（重複チェック付き） ---
    document.getElementById('login-btn').addEventListener('click', async () => {
      try {
        const val = document.getElementById('my-username-input').value.trim();
        if (!val) return alert("名前を入力してください");

        // 重複チェック
        const snap = await db.ref(`users/${val}`).once('value');
        if (snap.exists()) return alert("このIDは既に使われています。別の名前にしてください。");

        // 鍵生成と保存
        myKeyPair = await generateKeys();
        const pubB64 = await exportKey(myKeyPair.publicKey, "spki");
        const privB64 = await exportKey(myKeyPair.privateKey, "pkcs8");

        await db.ref(`users/${val}`).set({ publicKey: pubB64 });

        myUsername = val;
        localStorage.setItem('bunker_my_username', myUsername);
        localStorage.setItem('bunker_my_privkey', privB64);

        document.getElementById('login-modal').style.display = 'none';
        document.getElementById('my-name-display').textContent = `ID: @${myUsername}`;
      } catch(e) { alert("登録エラー: " + e.message); }
    });

    // --- 相手を追加 ---
    document.getElementById('add-dm-btn').addEventListener('click', async () => {
      try {
        const target = document.getElementById('target-user-input').value.trim();
        if (!target || target === myUsername) return alert("無効なIDです");
        
        // 相手の公開鍵を取得
        const snap = await db.ref(`users/${target}`).once('value');
        if (!snap.exists()) return alert("相手が見つかりません");

        const targetPubStr = snap.val().publicKey;
        const targetPubKey = await importPublicKey(targetPubStr);

        // 共有鍵の生成 (これがないと暗号化できない)
        activeSharedKey = await deriveSharedKey(myKeyPair.privateKey, targetPubKey);
        activeTargetUser = target;

        document.getElementById('current-chat-title').textContent = `@${target}`;
        document.getElementById('msg-input').disabled = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('app-container').classList.add('mobile-chat-active');
        
        const roomId = [myUsername, target].sort().join('___');
        if (currentDmRef) currentDmRef.off();
        currentDmRef = db.ref(`dms/${roomId}`);
        
        // メッセージ受信＆復号
        currentDmRef.on('value', async (snapshot) => {
          const list = document.getElementById('message-list');
          list.innerHTML = '';
          if (!snapshot.exists()) return list.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">メッセージなし</div>';
          
          const data = snapshot.val();
          for (let id in data) {
            try {
              // 暗号化されたテキストを復号する
              const jsonStr = await decryptText(data[id].ciphertext, activeSharedKey);
              const m = JSON.parse(jsonStr);
              
              list.innerHTML += `
                <div class="message-item">
                  <div class="avatar">${m.sender.charAt(0)}</div>
                  <div class="message-content">
                    <div class="message-meta">
                      <span class="username">@${m.sender}</span>
                      <span class="timestamp">${m.time}</span>
                    </div>
                    <div class="message-body">${m.text.replace(/</g, "&lt;")}</div>
                  </div>
                </div>`;
            } catch(e) { console.error("復号エラー"); }
          }
          list.scrollTop = list.scrollHeight;
        });
      } catch(e) { alert("相手追加エラー: " + e.message); }
    });

    // --- 2. メッセージ送信（完全なE2EE暗号化） ---
    document.getElementById('send-btn').addEventListener('click', async () => {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !currentDmRef || !activeSharedKey) return;

      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
      
      // 平文をJSONにしてから暗号化
      const payload = JSON.stringify({ sender: myUsername, text: text, time: timeStr });
      const encrypted = await encryptText(payload, activeSharedKey);

      // Firebaseには暗号文(ciphertext)だけを送る
      await currentDmRef.push({ ciphertext: encrypted });
      input.value = '';
    });
  </script>
</body>
</html>
