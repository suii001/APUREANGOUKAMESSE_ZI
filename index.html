<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>Bunker [E2EE Protected]</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0404;
      --bg-panel: #140808;
      --bg-card: #1f0c0c;
      --accent-red: #8b0000;
      --bright-red: #ff3333;
      --gold-accent: #d4af37;
      --text-main: #f0f0f0;
      --text-dim: #a08080;
      --border-color: #3d1414;
      --green-online: #00ff66;
    }
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 12px;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }
    .status-badge {
      font-size: 11px;
      color: var(--gold-accent);
      cursor: pointer;
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 4px;
      background: rgba(0,0,0,0.3);
    }
    .container {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }
    input, button, textarea {
      background: #270e0e;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 4px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
    }
    button {
      background-color: var(--accent-red);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      border: 1px solid #a30000;
    }
    button:active { background-color: var(--bright-red); }
    
    .section-title {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .user-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      max-height: 180px;
      border: 1px solid var(--border-color);
      padding: 6px;
      background: rgba(0,0,0,0.2);
    }
    .user-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .user-card:hover, .user-card.active {
      border-color: var(--gold-accent);
      background: #2a1010;
    }
    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--green-online);
      box-shadow: 0 0 5px var(--green-online);
    }

    .chat-box {
      flex: 1;
      border: 1px solid var(--border-color);
      background: rgba(0,0,0,0.4);
      padding: 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-bubble {
      max-width: 80%;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.4;
      word-break: break-all;
    }
    .msg-mine {
      align-self: flex-end;
      background: #3d1010;
      border: 1px solid var(--accent-red);
      color: #fff;
    }
    .msg-other {
      align-self: flex-start;
      background: #181818;
      border: 1px solid #333;
      color: var(--text-main);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      padding: 20px;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
    }
    .modal-content {
      background: var(--bg-panel);
      border: 1px solid var(--gold-accent);
      padding: 16px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <span style="color:var(--bright-red);">BUNKER // E2EE</span>
    <div id="my-id-display" class="status-badge">未接続 [設定]</div>
  </header>

  <div class="container">
    <!-- ログインセクション -->
    <div id="login-section">
      <div class="section-title">AGENT IDENTIFICATION</div>
      <div style="display:flex; gap:6px;">
        <input type="text" id="username-input" placeholder="エージェントID (例: agent_01)" style="flex:1;">
        <button id="register-btn">接続</button>
      </div>
    </div>

    <!-- メインチャット＆ユーザー一覧セクション -->
    <div id="chat-section" style="display:none; flex:1; flex-direction:column; gap:8px; overflow:hidden;">
      
      <!-- 相手アカウント一覧 -->
      <div class="section-title">TARGET AGENTS (タップで選択)</div>
      <div class="user-list" id="user-list-container">
        <!-- テストBot（常駐） -->
        <div class="user-card" onclick="selectTarget('@echo_bot')">
          <span>@echo_bot <small style="color:var(--gold-accent);">(テスト用Bot)</small></span>
          <div class="online-dot"></div>
        </div>
      </div>

      <!-- チャットログ -->
      <div class="section-title" id="active-target-title">TARGET: 未選択</div>
      <div class="chat-box" id="chat-messages">
        <div style="color:var(--text-dim); text-align:center; margin-top:20px;">
          リストから相手を選択するか、テストBot（@echo_bot）に暗号化メッセージを送信してください。
        </div>
      </div>

      <!-- 送信エリア -->
      <div style="display:flex; gap:6px;">
        <textarea id="msg-input" placeholder="暗号化メッセージを入力..." style="flex:1; height:42px; resize:none;"></textarea>
        <button id="send-btn">送信</button>
      </div>
    </div>
  </div>

  <!-- アカウント設定モーダル -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <div style="color:var(--gold-accent); font-weight:bold;">ACCOUNT SETTINGS</div>
      <div style="font-size:11px; color:var(--text-dim);">
        Agent ID: <span id="modal-agent-id" style="color:#fff;">-</span>
      </div>
      <div>
        <div style="font-size:10px; color:var(--text-dim); margin-bottom:2px;">Public Key (公開鍵):</div>
        <textarea id="modal-pubkey" readonly style="width:100%; height:60px; font-size:10px; word-break:break-all;"></textarea>
      </div>
      <button id="logout-btn" style="background-color:#5a0000;">ログアウト (鍵を消去)</button>
      <button id="close-modal-btn" style="background-color:#222; border-color:#444;">閉じる</button>
    </div>
  </div>

  <script>
    // Firebase初期化
    const firebaseConfig = {
      apiKey: "AIzaSyBnVBvyE8pfFc4WUAbAtCJXScsWWRmhzwk",
      databaseURL: "https://apure-chat-9e687-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "apure-chat-9e687"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myUsername = null;
    let myKeyPair = null;
    let activeTarget = null;
    let activeSharedKey = null;
    const BLOCK_SIZE = 512;

    // --- パディング処理 ---
    function padData(str) {
      const enc = new TextEncoder().encode(str);
      const paddedLen = Math.ceil((enc.length + 2) / BLOCK_SIZE) * BLOCK_SIZE;
      const padded = new Uint8Array(paddedLen);
      padded[0] = (enc.length >> 8) & 0xff;
      padded[1] = enc.length & 0xff;
      padded.set(enc, 2);
      return padded;
    }
    function unpadData(buffer) {
      const arr = new Uint8Array(buffer);
      const len = (arr[0] << 8) | arr[1];
      return new TextDecoder().decode(arr.slice(2, 2 + len));
    }
    function bufferToBase64(b) {
      let binary = '';
      const bytes = new Uint8Array(b);
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    // --- 暗号鍵API ---
    async function generateKeys() {
      return await window.crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
    }
    async function exportKey(key) {
      return bufferToBase64(await window.crypto.subtle.exportKey("spki", key));
    }
    async function importPublicKey(base64) {
      const binary = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      return await window.crypto.subtle.importKey("spki", binary, { name: "ECDH", namedCurve: "P-256" }, true, []);
    }
    async function deriveSharedKey(privKey, pubKey) {
      return await window.crypto.subtle.deriveKey({ name: "ECDH", public: pubKey }, privKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    }
    async function encryptText(text, key) {
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const enc = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, padData(text));
      const combined = new Uint8Array(12 + enc.byteLength);
      combined.set(iv, 0); combined.set(new Uint8Array(enc), 12);
      return bufferToBase64(combined);
    }
    async function decryptText(base64, key) {
      const data = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      const dec = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(0, 12) }, key, data.slice(12));
      return unpadData(dec);
    }

    // --- ログイン・登録処理 ---
    document.getElementById('register-btn').addEventListener('click', async () => {
      const val = document.getElementById('username-input').value.trim();
      if (!val) return alert('IDを入力してください');

      try {
        myKeyPair = await generateKeys();
        const pubB64 = await exportKey(myKeyPair.publicKey);
        await db.ref(`users/${val}`).set({ publicKey: pubB64, lastSeen: Date.now() });

        myUsername = val;
        document.getElementById('my-id-display').textContent = `@${myUsername} [設定]`;
        document.getElementById('modal-agent-id').textContent = `@${myUsername}`;
        document.getElementById('modal-pubkey').value = pubB64;
        
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('chat-section').style.display = 'flex';

        listenUserList();

      } catch (err) {
        alert('接続エラー: HTTPSで接続されているか、Firebaseルールを確認してください。');
      }
    });

    // --- 相手アカウント一覧のリアルタイム監視 ---
    function listenUserList() {
      db.ref('users').on('value', (snapshot) => {
        const listContainer = document.getElementById('user-list-container');
        listContainer.innerHTML = `
          <div class="user-card ${activeTarget === '@echo_bot' ? 'active' : ''}" onclick="selectTarget('@echo_bot')">
            <span>@echo_bot <small style="color:var(--gold-accent);">(テスト用Bot)</small></span>
            <div class="online-dot"></div>
          </div>
        `;
        if (!snapshot.exists()) return;

        const users = snapshot.val();
        for (let uid in users) {
          if (uid === myUsername) continue;
          const card = document.createElement('div');
          card.className = `user-card ${activeTarget === uid ? 'active' : ''}`;
          card.onclick = () => selectTarget(uid, users[uid].publicKey);
          card.innerHTML = `
            <span>@${uid}</span>
            <div class="online-dot"></div>
          `;
          listContainer.appendChild(card);
        }
      });
    }

    // --- 通信相手の選択 ---
    async function selectTarget(targetId, pubKeyB64 = null) {
      activeTarget = targetId;
      document.getElementById('active-target-title').textContent = `TARGET: @${targetId}`;
      
      document.querySelectorAll('.user-card').forEach(c => c.classList.remove('active'));

      if (targetId === '@echo_bot') {
        activeSharedKey = await deriveSharedKey(myKeyPair.privateKey, myKeyPair.publicKey);
      } else {
        if (!pubKeyB64) {
          const snap = await db.ref(`users/${targetId}`).once('value');
          pubKeyB64 = snap.val().publicKey;
        }
        const targetPubKey = await importPublicKey(pubKeyB64);
        activeSharedKey = await deriveSharedKey(myKeyPair.privateKey, targetPubKey);
      }

      loadMessages();
    }

    // --- チャットログ読み込み ---
    function loadMessages() {
      const box = document.getElementById('chat-messages');
      box.innerHTML = '';
      if (!activeTarget) return;

      const roomId = [myUsername, activeTarget].sort().join('___');
      db.ref(`dms/${roomId}/messages`).on('value', async (snapshot) => {
        box.innerHTML = '';
        if (!snapshot.exists()) return;

        const data = snapshot.val();
        for (let id in data) {
          try {
            const plain = await decryptText(data[id].ciphertext, activeSharedKey);
            const m = JSON.parse(plain);
            const isMine = m.sender === myUsername;
            
            box.innerHTML += `
              <div class="msg-bubble ${isMine ? 'msg-mine' : 'msg-other'}">
                <div style="font-size:10px; opacity:0.7; margin-bottom:2px;">@${m.sender}</div>
                <div>${m.text}</div>
              </div>
            `;
          } catch (e) {
            box.innerHTML += `<div style="color:red; font-size:10px;">[復号失敗]</div>`;
          }
        }
        box.scrollTop = box.scrollHeight;
      });
    }

    // --- メッセージ送信 ＆ Botの自動返信 ---
    document.getElementById('send-btn').addEventListener('click', async () => {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !activeSharedKey || !activeTarget) return;

      const roomId = [myUsername, activeTarget].sort().join('___');
      
      const payload = JSON.stringify({ sender: myUsername, text: text, timestamp: Date.now() });
      const encrypted = await encryptText(payload, activeSharedKey);

      await db.ref(`dms/${roomId}/messages`).push({ ciphertext: encrypted });
      input.value = '';

      if (activeTarget === '@echo_bot') {
        setTimeout(async () => {
          const botReply = JSON.stringify({ 
            sender: '@echo_bot', 
            text: `[ACK] 受信成功: "${text}" (暗号化通信は正常に機能しています)`, 
            timestamp: Date.now() 
          });
          const botEncrypted = await encryptText(botReply, activeSharedKey);
          await db.ref(`dms/${roomId}/messages`).push({ ciphertext: botEncrypted });
        }, 800);
      }
    });

    // --- アカウント設定モーダル操作 ---
    document.getElementById('my-id-display').addEventListener('click', () => {
      if (myUsername) document.getElementById('settings-modal').style.display = 'flex';
    });
    document.getElementById('close-modal-btn').addEventListener('click', () => {
      document.getElementById('settings-modal').style.display = 'none';
    });
    document.getElementById('logout-btn').addEventListener('click', () => {
      location.reload();
    });

    // --- Service Worker 登録 (PWA) ---
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
