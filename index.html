<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Style Secure Messenger</title>
  <style>
    :root {
      --bg-primary: #313338;
      --bg-secondary: #2b2d31;
      --bg-tertiary: #1e1f22;
      --channel-textarea: #383a40;
      --text-normal: #dbdee1;
      --text-muted: #949ba4;
      --brand-color: #5865f2;
      --brand-hover: #4752c4;
      --green-color: #23a55a;
      --red-color: #f23f43;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: var(--bg-tertiary);
      color: var(--text-normal);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      background-color: var(--bg-primary);
      width: 100%;
      max-width: 600px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-subtle);
    }

    /* チャンネルヘッダー風 */
    .chat-header {
      background-color: var(--bg-primary);
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header .hashtag {
      color: var(--text-muted);
      font-size: 24px;
      font-weight: bold;
    }

    .chat-header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .chat-header .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: auto;
    }

    /* メインコンテンツエリア */
    .chat-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea, input[type="password"] {
      width: 100%;
      background-color: var(--bg-tertiary);
      border: 1px solid transparent;
      border-radius: 4px;
      padding: 12px;
      color: var(--text-normal);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus, input[type="password"]:focus {
      border-color: var(--brand-color);
    }

    textarea {
      height: 110px;
      resize: vertical;
    }

    .btn {
      background-color: var(--brand-color);
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--brand-hover);
    }

    /* Discordの組み込みメッセージ（Embed）風スタイル */
    .embed-card {
      background-color: var(--bg-secondary);
      border-left: 4px solid var(--brand-color);
      border-radius: 4px;
      padding: 16px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .embed-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .embed-content {
      font-size: 14px;
      color: var(--text-normal);
      word-break: break-all;
      white-space: pre-wrap;
      line-height: 1.4;
    }

    .status-message {
      font-size: 13px;
      text-align: center;
      padding: 8px;
      border-radius: 4px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ヘッダー -->
    <div class="chat-header">
      <span class="hashtag">#</span>
      <h1>secure-messenger</h1>
      <span class="subtitle">AES-GCM 256-bit</span>
    </div>

    <div class="chat-body">
      <!-- 1. 作成モード -->
      <div id="create-mode" class="form-group">
        <div class="form-group">
          <label>メッセージ内容</label>
          <textarea id="msg-input" placeholder="暗号化したい秘密のメッセージを入力..."></textarea>
        </div>

        <div class="form-group">
          <label>復号パスワード</label>
          <input type="password" id="encrypt-key" placeholder="パスワードを設定">
        </div>

        <button class="btn" onclick="encryptAndGenerateLink()">暗号化リンクを生成</button>

        <div id="link-result" class="embed-card hidden">
          <div class="embed-title">🔗 共有用リンク</div>
          <div id="generated-url" class="embed-content" style="color: var(--brand-color);"></div>
          <button class="btn" style="margin-top: 8px;" onclick="copyLink()">リンクをコピー</button>
        </div>
      </div>

      <!-- 2. 復号モード（URLハッシュが存在する時） -->
      <div id="read-mode" class="form-group hidden">
        <div class="embed-card" style="border-left-color: #f59e0b;">
          <div class="embed-title">🔒 暗号化されたメッセージを受信しました</div>
          <div class="embed-content" style="color: var(--text-muted);">閲覧するには設定されたパスワードを入力してください。</div>
        </div>

        <div class="form-group" style="margin-top: 12px;">
          <label>パスワード</label>
          <input type="password" id="decrypt-key" placeholder="パスワードを入力">
        </div>

        <button class="btn" onclick="decryptLinkMessage()">メッセージを復号</button>

        <div id="decrypt-result" class="embed-card hidden" style="border-left-color: var(--green-color);">
          <div class="embed-title">💬 復号されたメッセージ</div>
          <div class="embed-content" id="plain-text"></div>
        </div>
      </div>

      <div id="status-msg" class="status-message"></div>
    </div>
  </div>

  <script>
    async function getKeyMaterial(password) {
      const enc = new TextEncoder();
      return window.crypto.subtle.importKey(
        "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
      );
    }

    async function deriveKey(keyMaterial, salt) {
      return window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptAndGenerateLink() {
      const text = document.getElementById('msg-input').value;
      const password = document.getElementById('encrypt-key').value;

      if (!text || !password) {
        alert("メッセージとパスワードの両方を入力してください。");
        return;
      }

      const enc = new TextEncoder();
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const iv = window.crypto.getRandomValues(new Uint8Array(12));

      const keyMaterial = await getKeyMaterial(password);
      const key = await deriveKey(keyMaterial, salt);

      const encrypted = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        enc.encode(text)
      );

      const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(new Uint8Array(encrypted), salt.length + iv.length);

      const base64Data = btoa(String.fromCharCode(...combined))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

      const fullUrl = `${location.origin}${location.pathname}#${base64Data}`;
      
      document.getElementById('generated-url').innerText = fullUrl;
      document.getElementById('link-result').classList.remove('hidden');
    }

    async function decryptLinkMessage() {
      const password = document.getElementById('decrypt-key').value;
      const hash = location.hash.substring(1);

      if (!password || !hash) return;

      try {
        const base64 = hash.replace(/-/g, '+').replace(/_/g, '/');
        const str = atob(base64);
        const data = Uint8Array.from(str, c => c.charCodeAt(0));

        const salt = data.slice(0, 16);
        const iv = data.slice(16, 28);
        const ciphertext = data.slice(28);

        const keyMaterial = await getKeyMaterial(password);
        const key = await deriveKey(keyMaterial, salt);

        const decrypted = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          key,
          ciphertext
        );

        const dec = new TextDecoder();
        document.getElementById('plain-text').innerText = dec.decode(decrypted);
        document.getElementById('decrypt-result').classList.remove('hidden');
        document.getElementById('status-msg').innerText = "✅ 正常に復号されました";
        document.getElementById('status-msg').style.color = "var(--green-color)";
      } catch (e) {
        document.getElementById('status-msg').innerText = "❌ パスワードが正しいか確認してください";
        document.getElementById('status-msg').style.color = "var(--red-color)";
      }
    }

    function copyLink() {
      const urlText = document.getElementById('generated-url').innerText;
      navigator.clipboard.writeText(urlText);
      alert("リンクをクリップボードにコピーしました！");
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (location.hash && location.hash.length > 1) {
        document.getElementById('create-mode').classList.add('hidden');
        document.getElementById('read-mode').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
