<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бункер - Secure End-to-End Encrypted Chat</title>
  <style>
    :root {
      --bg-dark: #100505;
      --bg-panel: #1b0a0a;
      --bg-msg: #2a0f0f;
      --accent-red: #8b0000;
      --text-main: #f0f0f0;
      --text-muted: #a08080;
      --border-color: #3d1414;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
      -webkit-touch-callout: none;
    }

    .chat-container {
      background-color: var(--bg-panel);
      width: 100%;
      max-width: 500px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .chat-header {
      padding: 16px;
      background-color: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
      text-align: center;
      color: #ff4d4d;
      font-size: 14px;
      user-select: none;
      letter-spacing: 1px;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--accent-red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .message-content { flex: 1; min-width: 0; }

    .message-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .username {
      font-weight: bold;
      font-size: 14px;
      color: #ff8080;
    }

    .timestamp {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* リプライ（引用）表示スタイル */
    .reply-quote {
      background: #140808;
      border-left: 3px solid var(--accent-red);
      padding: 4px 8px;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--text-muted);
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reply-quote strong {
      color: #ff8080;
      margin-right: 4px;
    }

    .message-body {
      background-color: var(--bg-msg);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid var(--border-color);
    }

    .edited-tag {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: 6px;
    }

    /* 返信・編集アクションボタン */
    .msg-actions {
      display: flex;
      gap: 12px;
      margin-top: 4px;
    }

    .msg-action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      padding: 0;
      width: auto;
    }

    .msg-action-btn:hover {
      color: #ff8080;
      text-decoration: underline;
    }

    /* 入力エリア＆アクションプレビューバー */
    .chat-input-area {
      padding: 12px;
      background-color: var(--bg-dark);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-bar {
      background-color: #220a0a;
      border: 1px solid var(--accent-red);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #ff8080;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .action-bar button {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      width: auto;
      padding: 0 4px;
    }

    .action-bar button:hover {
      color: #fff;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input, textarea, button {
      width: 100%;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    textarea { height: 60px; resize: none; }

    button {
      background-color: var(--accent-red);
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>

  <!-- Firebase SDK Compat v9.22.2 -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      Бункер (Bunker) - E2EE Chat
    </div>

    <div class="chat-messages" id="message-list">
      <div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">
        ルームIDとパスワードを入力すると暗号化メッセージが表示されます。
      </div>
    </div>

    <div class="chat-input-area">
      <!-- 返信 / 編集のアクション表示バー -->
      <div id="action-bar" class="action-bar" style="display: none;">
        <span id="action-text"></span>
        <button type="button" onclick="cancelAction()">✕</button>
      </div>

      <div class="input-row">
        <input type="text" id="room-id" placeholder="ルームID" value="Nhabaka_v2" style="flex: 1;">
        <input type="text" id="user-input" placeholder="ユーザー名" style="flex: 1;">
      </div>
      <input type="password" id="secret-key" placeholder="共通パスワード (必須)">
      <textarea id="msg-input" placeholder="暗号化メッセージを入力..."></textarea>
      <button id="send-btn" type="button">送信 (AES-GCM 256)</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "apure-chat-9e687.firebaseapp.com",
      databaseURL: "https://apure-chat-9e687-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "apure-chat-9e687",
      storageBucket: "apure-chat-9e687.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let db, messagesRef;
    let currentRoomId = '';
    let latestSnapshot = null;
    let isSending = false;
    let currentRenderSeq = 0; 

    // アクション状態（リプライ・編集）
    let activeReply = null;      // { id, user, text }
    let activeEditId = null;     // 編集対象のメッセージID

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.error("Firebase Init Error:", e);
    }

    // -----------------------------------------------------------
    // 鍵導出のキャッシュ管理
    // -----------------------------------------------------------
    let cryptoKeyCache = null;
    let cryptoKeyId = '';

    async function getCryptoKey(password, roomId) {
      const cacheId = `${password}::${roomId}`;
      if (cryptoKeyCache && cryptoKeyId === cacheId) {
        return cryptoKeyCache;
      }

      const enc = new TextEncoder();
      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      const saltStr = roomId.padEnd(16, '0').slice(0, 16);
      const salt = enc.encode(saltStr);

      cryptoKeyCache = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 300000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
      cryptoKeyId = cacheId;

      return cryptoKeyCache;
    }

    // -----------------------------------------------------------
    // 暗号化・復号化
    // -----------------------------------------------------------
    async function encryptText(text, password, roomId) {
      const enc = new TextEncoder();
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const key = await getCryptoKey(password, roomId);

      const encrypted = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        enc.encode(text)
      );

      const combined = new Uint8Array(iv.length + encrypted.byteLength);
      combined.set(iv, 0);
      combined.set(new Uint8Array(encrypted), iv.length);

      return btoa(String.fromCharCode(...combined))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function decryptText(base64Data, password, roomId) {
      const base64 = base64Data.replace(/-/g, '+').replace(/_/g, '/');
      const str = atob(base64);
      const data = Uint8Array.from(str, c => c.charCodeAt(0));

      if (data.length < 12) throw new Error("Invalid payload size");

      const iv = data.slice(0, 12);
      const ciphertext = data.slice(12);
      const key = await getCryptoKey(password, roomId);

      const decrypted = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        ciphertext
      );

      const dec = new TextDecoder();
      return dec.decode(decrypted);
    }

    // -----------------------------------------------------------
    // ルーム接続
    // -----------------------------------------------------------
    function updateRoomSubscription() {
      const roomIdInput = document.getElementById('room-id').value.trim() || 'default-room';

      if (messagesRef) messagesRef.off();

      currentRoomId = roomIdInput;
      messagesRef = db.ref(`messages/${currentRoomId}`);
      
      messagesRef.on('value', (snapshot) => {
        latestSnapshot = snapshot;
        renderMessages(snapshot);
      });
    }

    // -----------------------------------------------------------
    // 返信・編集のアクション制御
    // -----------------------------------------------------------
    function setReply(id, user, text) {
      activeEditId = null;
      activeReply = { id, user, text };
      
      document.getElementById('action-text').innerHTML = `<strong>@${escapeHtml(user)}</strong> への返信: ${escapeHtml(text.slice(0, 20))}${text.length > 20 ? '...' : ''}`;
      document.getElementById('action-bar').style.display = 'flex';
      document.getElementById('send-btn').textContent = '送信 (AES-GCM 256)';
      document.getElementById('msg-input').focus();
    }

    function setEdit(id, text) {
      activeReply = null;
      activeEditId = id;

      document.getElementById('action-text').innerHTML = `メッセージを編集機能中`;
      document.getElementById('action-bar').style.display = 'flex';
      document.getElementById('msg-input').value = text;
      document.getElementById('send-btn').textContent = '更新 (AES-GCM 256)';
      document.getElementById('msg-input').focus();
    }

    function cancelAction() {
      activeReply = null;
      activeEditId = null;
      document.getElementById('action-bar').style.display = 'none';
      document.getElementById('msg-input').value = '';
      document.getElementById('send-btn').textContent = '送信 (AES-GCM 256)';
    }

    // -----------------------------------------------------------
    // 送信・更新処理
    // -----------------------------------------------------------
    async function sendMessage(e) {
      if (e) e.preventDefault();
      if (isSending) return;

      const userRaw = document.getElementById('user-input').value;
      const msgInput = document.getElementById('msg-input');
      const text = msgInput.value.trim();
      const password = document.getElementById('secret-key').value;
      const roomId = document.getElementById('room-id').value.trim() || 'default-room';
      const sendBtn = document.getElementById('send-btn');

      if (!password) { alert("共通パスワードを入力してください。"); return; }
      if (!text) { alert("メッセージを入力してください。"); return; }

      isSending = true;
      sendBtn.disabled = true;

      try {
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

        // 構造化した暗号化ペイロード作成
        const payloadData = {
          user: userRaw || 'Anonymous',
          text: text,
          time: timeStr,
          replyTo: activeReply ? { user: activeReply.user, text: activeReply.text } : null,
          edited: activeEditId ? true : false
        };

        const encryptedPayload = await encryptText(JSON.stringify(payloadData), password, roomId);

        if (activeEditId) {
          // 編集更新処理
          await messagesRef.child(activeEditId).update({
            ciphertext: encryptedPayload,
            editedAt: firebase.database.ServerValue.TIMESTAMP
          });
        } else {
          // 新規送信処理
          await messagesRef.push({
            ciphertext: encryptedPayload,
            timestamp: firebase.database.ServerValue.TIMESTAMP
          });
        }

        cancelAction();

      } catch (err) {
        alert("送信失敗: " + err.message);
        console.error(err);
      } finally {
        setTimeout(() => {
          isSending = false;
          sendBtn.disabled = false;
        }, 300);
      }
    }

    // -----------------------------------------------------------
    // メッセージ描画 (リプライ & 編集対応)
    // -----------------------------------------------------------
    async function renderMessages(snapshot) {
      const renderSeq = ++currentRenderSeq;
      const container = document.getElementById('message-list');
      const password = document.getElementById('secret-key').value;
      const roomId = document.getElementById('room-id').value.trim() || 'default-room';
      const currentUser = document.getElementById('user-input').value.trim() || 'Anonymous';

      if (!snapshot || !snapshot.exists()) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">メッセージはありません。</div>';
        return;
      }

      const dataObj = snapshot.val();

      if (!password) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">共通パスワードを入力すると暗号化メッセージが表示されます。</div>';
        return;
      }

      container.innerHTML = '<div style="text-align: center; color: var(--accent-red); font-size: 12px; padding: 20px;">復号中...</div>';

      const entries = Object.entries(dataObj).filter(([id, item]) => item.ciphertext);
      
      const decryptPromises = entries.map(async ([id, item]) => {
        try {
          const jsonStr = await decryptText(item.ciphertext, password, roomId);
          return { id, msg: JSON.parse(jsonStr) };
        } catch (e) {
          return null;
        }
      });

      const results = await Promise.all(decryptPromises);

      if (renderSeq !== currentRenderSeq) return;

      const fragment = document.createDocumentFragment();
      let validMsgCount = 0;

      results.forEach(res => {
        if (!res) return;
        const { id, msg } = res;
        validMsgCount++;

        const msgEl = document.createElement('div');
        msgEl.className = 'message-item';
        const initial = msg.user ? msg.user.charAt(0).toUpperCase() : '?';

        // リプライ（引用）要素の構築
        let replyHtml = '';
        if (msg.replyTo) {
          replyHtml = `
            <div class="reply-quote">
              <strong>@${escapeHtml(msg.replyTo.user)}</strong> ${escapeHtml(msg.replyTo.text)}
            </div>
          `;
        }

        // 編集タグの構築
        const editedTagHtml = msg.edited ? `<span class="edited-tag">(編集済み)</span>` : '';

        // 自分が送信したメッセージであれば「編集」ボタンを表示
        const isMyMessage = (msg.user === currentUser);
        const editBtnHtml = isMyMessage ? `<button class="msg-action-btn" onclick="setEdit('${id}', \`${escapeJsString(msg.text)}\`)">編集</button>` : '';

        msgEl.innerHTML = `
          <div class="avatar">${initial}</div>
          <div class="message-content">
            <div class="message-meta">
              <span class="username">${escapeHtml(msg.user)}</span>
              <span class="timestamp">${msg.time}</span>
            </div>
            ${replyHtml}
            <div class="message-body">${escapeHtml(msg.text)}${editedTagHtml}</div>
            <div class="msg-actions">
              <button class="msg-action-btn" onclick="setReply('${id}', \`${escapeJsString(msg.user)}\`, \`${escapeJsString(msg.text)}\`)">返信</button>
              ${editBtnHtml}
            </div>
          </div>
        `;
        fragment.appendChild(msgEl);
      });

      container.innerHTML = '';
      if (validMsgCount === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">表示できるメッセージがありません。</div>';
      } else {
        container.appendChild(fragment);
        container.scrollTop = container.scrollHeight;
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    function escapeJsString(str) {
      return str.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\${/g, '\\${');
    }

    const sendBtn = document.getElementById('send-btn');
    sendBtn.addEventListener('click', sendMessage);

    document.getElementById('secret-key').addEventListener('input', () => {
      if (latestSnapshot) renderMessages(latestSnapshot);
    });

    document.getElementById('user-input').addEventListener('input', () => {
      if (latestSnapshot) renderMessages(latestSnapshot);
    });

    document.getElementById('room-id').addEventListener('change', () => {
      cryptoKeyId = ''; 
      cancelAction();
      updateRoomSubscription();
    });

    updateRoomSubscription();
  </script>
</body>
</html>
