<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ephemeral Encrypted Chat</title>
  <style>
    :root {
      --bg-dark: #100505;
      --bg-panel: #1b0a0a;
      --bg-msg: #2a0f0f;
      --accent-red: #8b0000;
      --text-main: #f0f0f0;
      --text-muted: #a08080;
      --border-color: #3d1414;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .chat-container {
      background-color: var(--bg-panel);
      width: 100%;
      max-width: 500px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .chat-header {
      padding: 16px;
      background-color: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
      text-align: center;
      color: #ff4d4d;
      font-size: 14px;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--accent-red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .message-content { flex: 1; }

    .message-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .username {
      font-weight: bold;
      font-size: 14px;
      color: #ff8080;
    }

    .timestamp {
      font-size: 11px;
      color: var(--text-muted);
    }

    .message-body {
      background-color: var(--bg-msg);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid var(--border-color);
    }

    .chat-input-area {
      padding: 12px;
      background-color: var(--bg-dark);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input, textarea, button {
      width: 100%;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    textarea { height: 60px; resize: none; }

    button {
      background-color: var(--accent-red);
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.8; }

    /* 追加：共有リンク表示用のカードボックス */
    .link-box {
      background-color: var(--bg-msg);
      border: 1px dashed #ff4d4d;
      padding: 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .link-text {
      font-size: 11px;
      color: #ff8080;
      word-break: break-all;
      max-height: 50px;
      overflow-y: auto;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      🔒 Secure Chat Log (2時間で自動消去)
    </div>

    <div class="chat-messages" id="message-list"></div>

    <div class="chat-input-area">
      <!-- 復号モード用入力 -->
      <div id="read-controls" class="hidden">
        <input type="password" id="decrypt-key" placeholder="復号キーを入力">
        <button onclick="decryptAndRender()">ログを表示する</button>
      </div>

      <!-- 作成モード用入力 -->
      <div id="create-controls" style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; gap: 8px;">
          <input type="text" id="user-input" placeholder="ユーザー名" style="flex: 1;">
          <input type="password" id="encrypt-key" placeholder="共通パスワード" style="flex: 1;">
        </div>
        <textarea id="msg-input" placeholder="メッセージを入力..."></textarea>
        <button onclick="addMessageAndGenerateLink()">投稿して共有リンク生成</button>

        <!-- 共有リンク表示エリア（初期状態は非表示） -->
        <div id="share-link-area" class="link-box hidden">
          <div style="font-size: 11px; color: var(--text-muted);">🔗 相手に送る共有リンク:</div>
          <div id="share-link-url" class="link-text"></div>
          <button onclick="copyShareLink()" style="background-color: #2a0f0f; border-color: #ff4d4d; color: #ff8080;">共有リンクをコピー</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let messages = [];
    const EXPIRE_MS = 2 * 60 * 60 * 1000; // 2時間

    async function getKeyMaterial(password) {
      const enc = new TextEncoder();
      return window.crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    }

    async function deriveKey(keyMaterial, salt) {
      return window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    function filterExpiredMessages(list) {
      const now = Date.now();
      return list.filter(msg => {
        return msg.createdAt && (now - msg.createdAt < EXPIRE_MS);
      });
    }

    function renderMessages(list) {
      const container = document.getElementById('message-list');
      container.innerHTML = '';
      
      const validMessages = filterExpiredMessages(list);

      if (validMessages.length === 0 && list.length > 0) {
        container.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 20px;">⏱️ すべてのメッセージの有効期限（2時間）が切れました。</div>';
        return;
      }

      validMessages.forEach(msg => {
        const item = document.createElement('div');
        item.className = 'message-item';
        const initial = msg.user ? msg.user.charAt(0).toUpperCase() : '?';
        
        item.innerHTML = `
          <div class="avatar">${initial}</div>
          <div class="message-content">
            <div class="message-meta">
              <span class="username">${escapeHtml(msg.user)}</span>
              <span class="timestamp">${msg.time}</span>
            </div>
            <div class="message-body">${escapeHtml(msg.text)}</div>
          </div>
        `;
        container.appendChild(item);
      });

      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    async function addMessageAndGenerateLink() {
      const user = document.getElementById('user-input').value || 'Anonymous';
      const text = document.getElementById('msg-input').value;
      const password = document.getElementById('encrypt-key').value;

      if (!text || !password) {
        alert("メッセージとパスワードを入力してください。");
        return;
      }

      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

      messages = filterExpiredMessages(messages);
      messages.push({
        user,
        text,
        time: timeStr,
        createdAt: now.getTime()
      });

      const jsonText = JSON.stringify(messages);

      const enc = new TextEncoder();
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const iv = window.crypto.getRandomValues(new Uint8Array(12));

      const keyMaterial = await getKeyMaterial(password);
      const key = await deriveKey(keyMaterial, salt);

      const encrypted = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        enc.encode(jsonText)
      );

      const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(new Uint8Array(encrypted), salt.length + iv.length);

      const base64Data = btoa(String.fromCharCode(...combined))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

      // 完全なURL（URL + # + 暗号データ）の生成
      const fullUrl = `${location.origin}${location.pathname}#${base64Data}`;

      // アドレスバーを更新
      location.hash = base64Data;
      
      // 画面内にリンクカードを表示
      document.getElementById('share-link-url').innerText = fullUrl;
      document.getElementById('share-link-area').classList.remove('hidden');

      document.getElementById('msg-input').value = '';
      renderMessages(messages);
    }

    function copyShareLink() {
      const urlText = document.getElementById('share-link-url').innerText;
      navigator.clipboard.writeText(urlText).then(() => {
        alert("共有リンクをコピーしました！");
      }).catch(() => {
        alert("コピーに失敗しました。手動で選択してコピーしてください。");
      });
    }

    async function decryptAndRender() {
      const password = document.getElementById('decrypt-key').value;
      const hash = location.hash.substring(1);

      if (!password || !hash) return;

      try {
        const base64 = hash.replace(/-/g, '+').replace(/_/g, '/');
        const str = atob(base64);
        const data = Uint8Array.from(str, c => c.charCodeAt(0));

        const salt = data.slice(0, 16);
        const iv = data.slice(16, 28);
        const ciphertext = data.slice(28);

        const keyMaterial = await getKeyMaterial(password);
        const key = await deriveKey(keyMaterial, salt);

        const decrypted = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          key,
          ciphertext
        );

        const dec = new TextDecoder();
        const rawMessages = JSON.parse(dec.decode(decrypted));
        
        messages = filterExpiredMessages(rawMessages);
        renderMessages(messages);

        document.getElementById('read-controls').classList.add('hidden');
        document.getElementById('create-controls').classList.remove('hidden');
        document.getElementById('encrypt-key').value = password;
      } catch (e) {
        alert("パスワードが正しくないか、データが破損しています。");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (location.hash && location.hash.length > 1) {
        document.getElementById('create-controls').classList.add('hidden');
        document.getElementById('read-controls').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
