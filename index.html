<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ШИФРОВАЛЬЩИК // SECURE MESSENGER</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --border-color: rgba(255, 255, 255, 0.1);
      --danger-color: #ef4444;
      --success-color: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Monospace, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      max-width: 550px;
      width: 100%;
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 20px;
      text-align: center;
      margin-bottom: 20px;
      color: var(--accent-color);
      letter-spacing: 1.5px;
    }

    .mode-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    textarea, input[type="password"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0b0f19;
      color: var(--text-color);
      font-size: 14px;
      outline: none;
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    button {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: white;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }

    .result-area {
      margin-top: 15px;
      word-break: break-all;
      background-color: #0b0f19;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 12px;
    }

    .decrypted-text {
      font-size: 15px;
      color: #e2e8f0;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .status {
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🔒 SECURE MESSENGER</h1>

    <!-- 1. 作成モード（ハッシュがない時） -->
    <div id="create-mode" class="mode-panel">
      <textarea id="msg-input" placeholder="Введите секретное сообщение... (メッセージを入力)"></textarea>
      <input type="password" id="encrypt-key" placeholder="Пароль для расшифровки (パスワード)">
      <button onclick="encryptAndGenerateLink()">Зашифровать и создать ссылку (暗号化リンク作成)</button>

      <div id="link-result" class="result-area hidden">
        <div style="color: #94a3b8; margin-bottom: 5px;">Ссылка с зашифрованным сообщением:</div>
        <div id="generated-url" style="color: var(--accent-color);"></div>
        <button onclick="copyLink()" style="margin-top: 10px; width: 100%;">Скопировать ссылку (リンクをコピー)</button>
      </div>
    </div>

    <!-- 2. 復号モード（URLハッシュが存在する時） -->
    <div id="read-mode" class="mode-panel hidden">
      <p style="font-size: 13px; color: #94a3b8; text-align: center;">Сообщение зашифровано. Введите пароль.</p>
      <input type="password" id="decrypt-key" placeholder="Введите пароль (パスワードを入力)">
      <button onclick="decryptLinkMessage()">Расшифровать (復号する)</button>

      <div id="decrypt-result" class="result-area hidden">
        <div class="decrypted-text" id="plain-text"></div>
      </div>
    </div>

    <div id="status-msg" class="status"></div>
  </div>

  <script>
    // Web Crypto API を使った AES-GCM 256-bit 暗号化ロジック
    async function getKeyMaterial(password) {
      const enc = new TextEncoder();
      return window.crypto.subtle.importKey(
        "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
      );
    }

    async function deriveKey(keyMaterial, salt) {
      return window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    // 暗号化処理
    async function encryptAndGenerateLink() {
      const text = document.getElementById('msg-input').value;
      const password = document.getElementById('encrypt-key').value;

      if (!text || !password) {
        alert("Заполните все поля (メッセージとパスワードを入力してください)");
        return;
      }

      const enc = new TextEncoder();
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const iv = window.crypto.getRandomValues(new Uint8Array(12));

      const keyMaterial = await getKeyMaterial(password);
      const key = await deriveKey(keyMaterial, salt);

      const encrypted = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        enc.encode(text)
      );

      // Salt + IV + 暗号化データを結合してBase64URL化
      const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(new Uint8Array(encrypted), salt.length + iv.length);

      const base64Data = btoa(String.fromCharCode(...combined))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

      // URLのハッシュ（#）部分に暗号化データをセット
      const fullUrl = `${location.origin}${location.pathname}#${base64Data}`;
      
      document.getElementById('generated-url').innerText = fullUrl;
      document.getElementById('link-result').classList.remove('hidden');
    }

    // 復号処理
    async function decryptLinkMessage() {
      const password = document.getElementById('decrypt-key').value;
      const hash = location.hash.substring(1);

      if (!password || !hash) return;

      try {
        // Base64URLデコード
        const base64 = hash.replace(/-/g, '+').replace(/_/g, '/');
        const str = atob(base64);
        const data = Uint8Array.from(str, c => c.charCodeAt(0));

        const salt = data.slice(0, 16);
        const iv = data.slice(16, 28);
        const ciphertext = data.slice(28);

        const keyMaterial = await getKeyMaterial(password);
        const key = await deriveKey(keyMaterial, salt);

        const decrypted = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          key,
          ciphertext
        );

        const dec = new TextDecoder();
        document.getElementById('plain-text').innerText = dec.decode(decrypted);
        document.getElementById('decrypt-result').classList.remove('hidden');
        document.getElementById('status-msg').innerText = "✅ Расшифровано успешно";
        document.getElementById('status-msg').style.color = "var(--success-color)";
      } catch (e) {
        document.getElementById('status-msg').innerText = "❌ Неверный пароль или повреждённые данные";
        document.getElementById('status-msg').style.color = "var(--danger-color)";
      }
    }

    function copyLink() {
      const urlText = document.getElementById('generated-url').innerText;
      navigator.clipboard.writeText(urlText);
      alert("Ссылка скопирована! (リンクをコピーしました)");
    }

    // 画面ロード時にハッシュの有無で表示モードを切り替え
    window.addEventListener('DOMContentLoaded', () => {
      if (location.hash && location.hash.length > 1) {
        document.getElementById('create-mode').classList.add('hidden');
        document.getElementById('read-mode').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
