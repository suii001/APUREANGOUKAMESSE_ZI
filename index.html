<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Бункер - E2EE Secure Messenger</title>
  <style>
    :root {
      --bg-dark: rgba(16, 5, 5, 0.85);
      --bg-panel: rgba(27, 10, 10, 0.88);
      --bg-msg: rgba(42, 15, 15, 0.9);
      --accent-red: #8b0000;
      --gold-accent: #d4af37;
      --text-main: #f0f0f0;
      --text-muted: #a08080;
      --border-color: #3d1414;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #7a0000;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 888'><rect width='100%_' height='100%_' fill='%237a0000'/><g transform='translate(250, 444)'><circle cx='0' cy='0' r='160' fill='none' stroke='%23d4af37' stroke-width='2' opacity='0.8'/><circle cx='0' cy='0' r='150' fill='none' stroke='%23d4af37' stroke-width='1.5' opacity='0.8'/><circle cx='0' cy='0' r='140' fill='none' stroke='%23d4af37' stroke-width='1' opacity='0.8'/><circle cx='0' cy='0' r='120' fill='none' stroke='%23d4af37' stroke-width='2' opacity='0.9'/><ellipse cx='0' cy='0' rx='120' ry='40' fill='none' stroke='%23d4af37' stroke-width='1' opacity='0.7'/><ellipse cx='0' cy='0' rx='40' ry='120' fill='none' stroke='%23d4af37' stroke-width='1' opacity='0.7'/><line x1='-120' y1='0' x2='120' y2='0' stroke='%23d4af37' stroke-width='1' opacity='0.7'/><line x1='0' y1='-120' x2='0' y2='120' stroke='%23d4af37' stroke-width='1' opacity='0.7'/><polygon points='0,-90 26,-15 95,-15 38,28 59,95 0,55 -59,95 -38,28 -95,-15 -26,-15' fill='none' stroke='%23d4af37' stroke-width='3' opacity='0.95'/><circle cx='10' cy='-155' r='4' fill='%23ff0000'/></g></svg>");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      background-color: var(--bg-panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      width: 100%;
      max-width: 900px;
      height: 100%;
      height: 100dvh;
      display: flex;
      border: 1px solid var(--border-color);
      overflow: hidden;
      position: relative;
    }

    /* サイドバー */
    .sidebar {
      width: 280px;
      background-color: var(--bg-dark);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100%;
    }

    .user-profile-header {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: rgba(16, 5, 5, 0.9);
    }

    .my-name {
      font-weight: bold;
      color: #ff8080;
      font-size: 13px;
      word-break: break-all;
    }

    .add-dm-box {
      display: flex;
      gap: 6px;
    }

    .add-dm-box input {
      flex: 1;
      padding: 8px;
      font-size: 12px;
      min-width: 0;
    }

    .add-dm-box button {
      padding: 8px 12px;
      font-size: 12px;
      white-space: nowrap;
    }

    .dm-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .dm-item {
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(26, 8, 8, 0.6);
      cursor: pointer;
    }

    .dm-item:hover, .dm-item.active {
      background-color: rgba(42, 12, 12, 0.7);
    }

    .dm-name {
      font-size: 13px;
      font-weight: bold;
      color: var(--text-main);
    }

    .dm-del-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      padding: 2px 6px;
      cursor: pointer;
    }

    .dm-del-btn:hover {
      color: #ff4d4d;
    }

    /* メインチャットエリア */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-panel);
      min-width: 0;
      height: 100%;
      height: 100dvh;
      position: relative;
    }

    .chat-header {
      padding: 10px 16px;
      background-color: rgba(16, 5, 5, 0.9);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
      z-index: 10;
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ff4d4d;
      font-size: 14px;
      font-weight: bold;
      min-width: 0;
    }

    .chat-header-right {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .chat-header-right select {
      background: rgba(27, 10, 10, 0.9);
      color: var(--gold-accent);
      border: 1px solid var(--border-color);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
    }

    .back-btn {
      display: none;
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background-color: var(--accent-red);
      border: 1px solid var(--gold-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      flex-shrink: 0;
    }

    .message-content {
      flex: 1;
      min-width: 0;
    }

    .message-meta {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 11px;
      align-items: center;
    }

    .username {
      color: #ff8080;
      font-weight: bold;
    }

    .timestamp {
      color: var(--text-muted);
    }

    .edited-mark {
      color: var(--text-muted);
      font-size: 10px;
    }

    .reply-quote {
      background: rgba(0, 0, 0, 0.3);
      border-left: 3px solid var(--gold-accent);
      padding: 4px 8px;
      margin-bottom: 6px;
      border-radius: 4px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .message-body {
      background-color: var(--bg-msg);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-all;
      border: 1px solid var(--border-color);
      display: inline-block;
      max-width: 100%;
    }

    .onetime-badge {
      background: rgba(212, 175, 55, 0.15);
      border: 1px dashed var(--gold-accent);
      color: var(--gold-accent);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }

    .onetime-badge:hover {
      background: rgba(212, 175, 55, 0.25);
    }

    .msg-actions {
      display: flex;
      gap: 10px;
      margin-top: 3px;
      font-size: 10px;
    }

    .msg-action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
    }

    .msg-action-btn:hover {
      color: #ff8080;
      text-decoration: underline;
    }

    .message-error {
      background-color: #3d0d0d;
      border-color: #8b0000;
      color: #ff8080;
      font-size: 12px;
    }

    /* 入力パネル */
    .input-panel {
      display: flex;
      flex-direction: column;
      background-color: rgba(16, 5, 5, 0.9);
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
      z-index: 10;
    }

    .active-mode-banner {
      display: none;
      padding: 6px 12px;
      background: rgba(50, 15, 15, 0.95);
      border-bottom: 1px solid var(--border-color);
      font-size: 11px;
      justify-content: space-between;
      align-items: center;
      color: var(--gold-accent);
    }

    .active-mode-banner.show {
      display: flex;
    }

    .chat-options-bar {
      padding: 6px 12px 0 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    .chat-options-bar label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .chat-input-area {
      padding: 8px 12px 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .file-attach-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--gold-accent);
      width: 38px;
      height: 38px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
    }

    .file-attach-btn:hover {
      background: rgba(212, 175, 55, 0.1);
    }

    input, button, textarea {
      background-color: rgba(27, 10, 10, 0.9);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    textarea {
      flex: 1;
      height: 38px;
      resize: none;
      font-family: inherit;
    }

    button {
      background-color: var(--accent-red);
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    button:disabled, textarea:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* モーダル共通 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      background-color: var(--bg-panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
    }

    .onetime-modal-content {
      background-color: var(--bg-panel);
      border: 2px solid var(--gold-accent);
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }

    .onetime-body-text {
      background: rgba(0, 0, 0, 0.4);
      padding: 16px;
      border-radius: 8px;
      font-size: 15px;
      word-break: break-all;
      color: var(--text-main);
      max-height: 300px;
      overflow-y: auto;
      text-align: left;
    }

    .onetime-body-text img {
      max-width: 100%;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
    }

    @media (max-width: 600px) {
      .app-container { border: none; }
      .sidebar { width: 100%; display: flex; }
      .chat-main { display: none; width: 100%; }
      .app-container.mobile-chat-active .sidebar { display: none; }
      .app-container.mobile-chat-active .chat-main { display: flex; }
      .back-btn { display: inline-block; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

  <!-- 初回ユーザー設定モーダル -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="color: #ff4d4d;">Бункер - ユーザー登録</h3>
      <p style="font-size: 12px; color: var(--text-muted);">暗号化通信のための固有IDを入力してください</p>
      <input type="text" id="my-username-input" placeholder="例: agent_01" onkeydown="if(event.key==='Enter') document.getElementById('login-btn').click()">
      <button type="button" id="login-btn">接続開始</button>
    </div>
  </div>

  <!-- ワンタイムメッセージ閲覧モーダル -->
  <div id="onetime-modal" class="modal-overlay" style="display: none;">
    <div class="onetime-modal-content">
      <h3 style="color: var(--gold-accent);">🔒 ワンタイム・メッセージ</h3>
      <div id="onetime-modal-body" class="onetime-body-text"></div>
      <button type="button" onclick="closeOnetimeModal()" style="padding: 10px; background: var(--accent-red);">✕ 閉じる（このメッセージは消滅します）</button>
    </div>
  </div>

  <div class="app-container" id="app-container">
    <!-- サイドバー -->
    <div class="sidebar">
      <div class="user-profile-header">
        <div class="my-name" id="my-name-display">ID: ---</div>
        <div class="add-dm-box">
          <input type="text" id="target-user-input" placeholder="相手のID / bunker_bot" onkeydown="if(event.key==='Enter') document.getElementById('add-dm-btn').click()">
          <button type="button" id="add-dm-btn">追加</button>
        </div>
      </div>
      <div class="dm-list" id="dm-list"></div>
    </div>

    <!-- チャットメイン領域 -->
    <div class="chat-main">
      <div class="chat-header">
        <div class="chat-header-left">
          <button class="back-btn" id="back-btn">← 戻る</button>
          <span id="current-chat-title">DM相手を選択してください</span>
        </div>
        <div class="chat-header-right">
          <span>自動消去:</span>
          <select id="timer-select" onchange="updateTimerSetting()">
            <option value="300000">5分</option>
            <option value="7200000" selected>2時間</option>
            <option value="86400000">24時間</option>
            <option value="0">無制限</option>
          </select>
        </div>
      </div>

      <div class="chat-messages" id="message-list">
        <div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">
          Бункерへようこそ。暗号化された安全な通信路です。<br>
          実験用ボットに話しかけるには、IDに <b style="color:var(--gold-accent)">bunker_bot</b> を追加してください。
        </div>
      </div>

      <!-- 入力パネル -->
      <div class="input-panel">
        <div id="mode-banner" class="active-mode-banner">
          <span id="mode-banner-text">返信中</span>
          <button type="button" onclick="cancelMode()" style="background:none; border:none; color:#ff8080; font-size:11px; cursor:pointer;">✕ キャンセル</button>
        </div>
        <div class="chat-options-bar">
          <label><input type="checkbox" id="onetime-checkbox"> ワンタイム（開封後に消滅）</label>
        </div>
        <div class="chat-input-area">
          <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFileSelect(event)">
          <button type="button" class="file-attach-btn" title="画像を添付" onclick="document.getElementById('file-input').click()">📎</button>
          <textarea id="msg-input" placeholder="暗号化メッセージを入力..." disabled></textarea>
          <button id="send-btn" type="button" style="width: 70px;" disabled>送信</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBnVBvyE8pfFc4WUAbAtCJXScsWWRmhzwk",
      authDomain: "apure-chat-9e687.firebaseapp.com",
      databaseURL: "https://apure-chat-9e687-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "apure-chat-9e687",
      storageBucket: "apure-chat-9e687.firebasestorage.app",
      messagingSenderId: "119464225734",
      appId: "1:119464225734:web:593e59a957c9d6a669e0c7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myUsername = '';
    let myKeyPair = null;
    let activeTargetUser = null;
    let activeSharedKey = null;
    let currentDmRef = null;
    let dmUsers = new Set(["bunker_bot"]); // 最初からボットをリストイン
    let currentTimerMs = 7200000;

    let currentMode = "normal";
    let activeReplyData = null;
    let editingMessageId = null;
    let attachedFileBase64 = null;
    let pendingDeleteMessageId = null;

    // ボット用のローカルキーキャッシュ
    const BOT_USERNAME = "bunker_bot";
    let botKeyPair = null;

    function bufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      const len = bytes.byteLength;
      for (let i = 0; i < len; i += 0x8000) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      }
      return btoa(binary);
    }

    async function generateKeys() {
      return await window.crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
    }
    async function exportKey(key, format) {
      const exported = await window.crypto.subtle.exportKey(format, key);
      return bufferToBase64(exported);
    }
    async function importPublicKey(base64) {
      const binary = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      return await window.crypto.subtle.importKey("spki", binary, { name: "ECDH", namedCurve: "P-256" }, false, []);
    }
    async function importPrivateKey(base64) {
      const binary = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      return await window.crypto.subtle.importKey("pkcs8", binary, { name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    }
    async function deriveSharedKey(privKey, pubKey) {
      return await window.crypto.subtle.deriveKey({ name: "ECDH", public: pubKey }, privKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    }
    async function encryptText(text, key) {
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const enc = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(text));
      const combined = new Uint8Array(12 + enc.byteLength);
      combined.set(iv, 0); combined.set(new Uint8Array(enc), 12);
      return bufferToBase64(combined);
    }
    async function decryptText(base64, key) {
      const data = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      const dec = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: data.slice(0, 12) }, key, data.slice(12));
      return new TextDecoder().decode(dec);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    function saveDmList() {
      if (!myUsername) return;
      localStorage.setItem(`bunker_dms_${myUsername}`, JSON.stringify([...dmUsers]));
    }

    function loadDmList() {
      if (!myUsername) return;
      const saved = localStorage.getItem(`bunker_dms_${myUsername}`);
      if (saved) {
        try {
          dmUsers = new Set(JSON.parse(saved));
          dmUsers.add(BOT_USERNAME); // 常にボットを含める
        } catch(e){}
      }
      renderDmList();
    }

    function renderDmList() {
      const listEl = document.getElementById('dm-list');
      listEl.innerHTML = '';
      dmUsers.forEach(target => {
        const item = document.createElement('div');
        item.className = `dm-item ${target === activeTargetUser ? 'active' : ''}`;
        item.onclick = () => openChatWith(target);
        const displayName = target === BOT_USERNAME ? '🤖 bunker_bot (実験用)' : `@${escapeHtml(target)}`;
        let delBtnHtml = target === BOT_USERNAME ? '' : `<button class="dm-del-btn" onclick="removeDmTarget('${escapeHtml(target)}', event)">✕</button>`;
        item.innerHTML = `
          <span class="dm-name">${displayName}</span>
          ${delBtnHtml}
        `;
        listEl.appendChild(item);
      });
    }

    function listenInbox() {
      if (!myUsername) return;
      db.ref(`users/${myUsername}/inbox`).on('child_added', (snapshot) => {
        const sender = snapshot.key;
        if (sender && sender !== myUsername) {
          dmUsers.add(sender);
          saveDmList();
          renderDmList();
        }
      });
    }

    window.removeDmTarget = function(target, event) {
      event.stopPropagation();
      if (target === BOT_USERNAME) return;
      dmUsers.delete(target);
      saveDmList();
      renderDmList();
      if (activeTargetUser === target) {
        activeTargetUser = null;
        if (currentDmRef) currentDmRef.off();
        document.getElementById('current-chat-title').textContent = 'DM相手を選択してください';
        document.getElementById('msg-input').disabled = true;
        document.getElementById('send-btn').disabled = true;
        document.getElementById('message-list').innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">相手を選択してください</div>';
      }
    };

    window.updateTimerSetting = function() {
      currentTimerMs = parseInt(document.getElementById('timer-select').value);
    };

    window.handleFileSelect = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 800;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          attachedFileBase64 = canvas.toDataURL('image/jpeg', 0.7);
          document.getElementById('msg-input').placeholder = "画像添付中... メッセージを添えて送信";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    // --- ボットの初期化と自動返信ロジック ---
    async function setupBotAccount() {
      try {
        let botSnap = await db.ref(`users/${BOT_USERNAME}`).once('value');
        if (!botSnap.exists()) {
          botKeyPair = await generateKeys();
          const pubB64 = await exportKey(botKeyPair.publicKey, "spki");
          const privB64 = await exportKey(botKeyPair.privateKey, "pkcs8");
          await db.ref(`users/${BOT_USERNAME}`).set({ publicKey: pubB64 });
          localStorage.setItem('bunker_bot_privkey', privB64);
        } else {
          let privB64 = localStorage.getItem('bunker_bot_privkey');
          if (!privB64) {
            botKeyPair = await generateKeys();
            privB64 = await exportKey(botKeyPair.privateKey, "pkcs8");
            localStorage.setItem('bunker_bot_privkey', privB64);
          } else {
            botKeyPair = { privateKey: await importPrivateKey(privB64) };
          }
        }
      } catch(e) {}
    }

    async function triggerBotReply(roomId, userMessage, isOneTime) {
      setTimeout(async () => {
        try {
          const botSnap = await db.ref(`users/${BOT_USERNAME}`).once('value');
          const botPubStr = botSnap.val().publicKey;
          const botPubKey = await importPublicKey(botPubStr);
          const privB64 = localStorage.getItem('bunker_bot_privkey');
          const botPrivKey = await importPrivateKey(privB64);

          // ユーザーの公開鍵を取得
          const userSnap = await db.ref(`users/${myUsername}`).once('value');
          const userPubStr = userSnap.val().publicKey;
          const userPubKey = await importPublicKey(userPubStr);

          // ボット視点での共有鍵
          const botSharedKey = await deriveSharedKey(botPrivKey, userPubKey);

          let replyText = `[BOT応答] 受信完了: "${userMessage}"`;
          if (isOneTime) {
            replyText = `[BOT応答] ワンタイムメッセージを正常に受信しました（自動消去テストOK）`;
          } else if (userMessage.includes("画像") || userMessage.includes("📎")) {
            replyText = `[BOT応答] 画像つきメッセージを正常に受信しました！`;
          }

          const now = new Date();
          const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
          
          const payload = {
            sender: BOT_USERNAME,
            text: replyText,
            file: null,
            time: timeStr,
            timestamp: Date.now(),
            expiry: currentTimerMs,
            onetime: isOneTime,
            edited: false
          };

          const encrypted = await encryptText(JSON.stringify(payload), botSharedKey);
          await db.ref(`dms/${roomId}`).push({ ciphertext: encrypted });
        } catch (err) {
          console.error("Bot reply error:", err);
        }
      }, 1000); // 1秒後に返信
    }

    // --- チャットルーム接続処理 ---
    async function openChatWith(target) {
      try {
        const snap = await db.ref(`users/${target}`).once('value');
        if (!snap.exists()) {
          alert("該当するIDは見つかりません");
          return;
        }

        const targetPubStr = snap.val().publicKey;
        const targetPubKey = await importPublicKey(targetPubStr);

        activeSharedKey = await deriveSharedKey(myKeyPair.privateKey, targetPubKey);
        activeTargetUser = target;

        dmUsers.add(target);
        saveDmList();
        renderDmList();

        const titleText = target === BOT_USERNAME ? '🤖 bunker_bot (実験用)' : `@${target}`;
        document.getElementById('current-chat-title').textContent = titleText;
        document.getElementById('msg-input').disabled = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('app-container').classList.add('mobile-chat-active');
        cancelMode();

        const roomId = [myUsername, target].sort().join('___');
        if (currentDmRef) currentDmRef.off();
        currentDmRef = db.ref(`dms/${roomId}`);

        currentDmRef.on('value', async (snapshot) => {
          const list = document.getElementById('message-list');
          list.innerHTML = '';

          if (!snapshot.exists()) {
            list.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">メッセージはありません。</div>';
            return;
          }

          const rawData = snapshot.val();
          const now = Date.now();
          let visibleCount = 0;

          for (let id in rawData) {
            const msgNode = rawData[id];
            try {
              const jsonStr = await decryptText(msgNode.ciphertext, activeSharedKey);
              const m = JSON.parse(jsonStr);

              if (m.expiry > 0 && m.timestamp && (now - m.timestamp > m.expiry)) {
                currentDmRef.child(id).remove();
                continue;
              }

              visibleCount++;
              const item = document.createElement('div');
              item.className = 'message-item';

              let replyHtml = '';
              if (m.replyTo) {
                replyHtml = `
                  <div class="reply-quote">
                    <strong>@${escapeHtml(m.replyTo.sender)}</strong>: ${escapeHtml(m.replyTo.text)}
                  </div>
                `;
              }

              let editedHtml = m.edited ? `<span class="edited-mark">(編集済)</span>` : '';
              let bodyHtml = '';

              if (m.onetime) {
                const badgeText = m.file ? '🔒 [ワンタイム画像 - タップして開封]' : '🔒 [ワンタイムメッセージ - タップして開封]';
                bodyHtml = `<div class="onetime-badge" onclick="openOnetimeMessage('${id}', '${escapeHtml(m.text || '').replace(/'/g, "\\'")}', '${m.file || ''}')">${badgeText}</div>`;
              } else {
                let fileHtml = m.file ? `<img src="${m.file}" alt="image" style="max-width:100%; max-height:200px; border-radius:4px; display:block; margin-top:4px;" onclick="window.open('${m.file}')">` : '';
                bodyHtml = `
                  <div class="message-body">
                    ${escapeHtml(m.text)}
                    ${fileHtml}
                  </div>
                `;
              }

              let actionsHtml = `<button class="msg-action-btn" onclick="startReply('${id}', '${escapeHtml(m.sender)}', '${escapeHtml(m.text || '[画像]').replace(/'/g, "\\'")}')">返信</button>`;
              if (m.sender === myUsername) {
                if (!m.onetime) {
                  actionsHtml += ` <button class="msg-action-btn" onclick="startEdit('${id}', '${escapeHtml(m.text || '').replace(/'/g, "\\'")}')">編集</button>`;
                }
                actionsHtml += ` <button class="msg-action-btn" style="color:#ff6b6b;" onclick="deleteMessage('${id}')">完全削除</button>`;
              }

              item.innerHTML = `
                <div class="avatar">${escapeHtml(m.sender.charAt(0).toUpperCase())}</div>
                <div class="message-content">
                  <div class="message-meta">
                    <span class="username">@${escapeHtml(m.sender)}</span>
                    <span class="timestamp">${escapeHtml(m.time)}</span>
                    ${editedHtml}
                  </div>
                  ${replyHtml}
                  ${bodyHtml}
                  <div class="msg-actions">${actionsHtml}</div>
                </div>
              `;
              list.appendChild(item);
            } catch (e) {
              const item = document.createElement('div');
              item.className = 'message-item';
              item.innerHTML = `
                <div class="avatar">?</div>
                <div class="message-content">
                  <div class="message-body message-error">⚠️ 復号失敗: 鍵が不一致です。</div>
                </div>
              `;
              list.appendChild(item);
            }
          }

          if (visibleCount === 0) {
            list.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">メッセージはありません</div>';
          }
          list.scrollTop = list.scrollHeight;
        });
      } catch (e) {
        alert("接続エラー: " + (e.message || e));
      }
    }

    window.openOnetimeMessage = function(id, text, file) {
      pendingDeleteMessageId = id;
      const bodyEl = document.getElementById('onetime-modal-body');
      let html = '';
      if (text) {
        html += `<p style="margin-bottom: 8px;">${escapeHtml(text)}</p>`;
      }
      if (file) {
        html += `<img src="${file}" alt="onetime image">`;
      }
      bodyEl.innerHTML = html;
      document.getElementById('onetime-modal').style.display = 'flex';
    };

    window.closeOnetimeModal = async function() {
      document.getElementById('onetime-modal').style.display = 'none';
      if (pendingDeleteMessageId && currentDmRef) {
        try {
          await currentDmRef.child(pendingDeleteMessageId).remove();
        } catch(e) {}
        pendingDeleteMessageId = null;
      }
    };

    window.deleteMessage = async function(id) {
      if (!currentDmRef || !confirm("このメッセージを双方の画面から完全に削除しますか？")) return;
      await currentDmRef.child(id).remove();
    };

    window.startReply = function(id, sender, text) {
      currentMode = "reply";
      activeReplyData = { sender, text };
      document.getElementById('mode-banner-text').textContent = `↩️ @${sender} さんへの返信: "${text.length > 25 ? text.substring(0, 25) + '...' : text}"`;
      document.getElementById('mode-banner').classList.add('show');
      document.getElementById('send-btn').textContent = "送信";
      document.getElementById('msg-input').focus();
    };

    window.startEdit = function(id, text) {
      currentMode = "edit";
      editingMessageId = id;
      document.getElementById('mode-banner-text').textContent = `✏️ メッセージを編集中`;
      document.getElementById('mode-banner').classList.add('show');
      document.getElementById('msg-input').value = text;
      document.getElementById('send-btn').textContent = "更新";
      document.getElementById('msg-input').focus();
    };

    window.cancelMode = function() {
      currentMode = "normal";
      activeReplyData = null;
      editingMessageId = null;
      document.getElementById('mode-banner').classList.remove('show');
      document.getElementById('send-btn').textContent = "送信";
      document.getElementById('msg-input').value = '';
      attachedFileBase64 = null;
      document.getElementById('msg-input').placeholder = "暗号化メッセージを入力...";
    };

    window.addEventListener('DOMContentLoaded', async () => {
      await setupBotAccount();
      try {
        const savedUser = localStorage.getItem('bunker_my_username');
        const savedPriv = localStorage.getItem('bunker_my_privkey');
        if (savedUser && savedPriv) {
          myUsername = savedUser;
          myKeyPair = { privateKey: await importPrivateKey(savedPriv) };
          document.getElementById('login-modal').style.display = 'none';
          document.getElementById('my-name-display').textContent = `ID: @${myUsername}`;
          loadDmList();
          listenInbox();
        }
      } catch (e) {
        console.error("自動ログインエラー:", e);
      }
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      try {
        const val = document.getElementById('my-username-input').value.trim();
        if (!val) return alert("ユーザー名を入力してください");
        if (val === BOT_USERNAME) return alert("このIDはシステム用のため使用できません");

        const snap = await db.ref(`users/${val}`).once('value');
        if (snap.exists()) {
          return alert("このIDは既に使われています。別のIDを入力してください。");
        }

        myKeyPair = await generateKeys();
        const pubB64 = await exportKey(myKeyPair.publicKey, "spki");
        const privB64 = await exportKey(myKeyPair.privateKey, "pkcs8");

        await db.ref(`users/${val}`).set({ publicKey: pubB64 });

        myUsername = val;
        try {
          localStorage.setItem('bunker_my_username', myUsername);
          localStorage.setItem('bunker_my_privkey', privB64);
        } catch (e) {}

        document.getElementById('login-modal').style.display = 'none';
        document.getElementById('my-name-display').textContent = `ID: @${myUsername}`;
        loadDmList();
        listenInbox();
      } catch (e) {
        alert("登録エラー: " + (e.message || e));
      }
    });

    document.getElementById('add-dm-btn').addEventListener('click', () => {
      const target = document.getElementById('target-user-input').value.trim();
      if (!target || target === myUsername) return alert("有効な相手のIDを入力してください");
      openChatWith(target);
      document.getElementById('target-user-input').value = '';
    });

    document.getElementById('back-btn').addEventListener('click', () => {
      document.getElementById('app-container').classList.remove('mobile-chat-active');
    });

    document.getElementById('send-btn').addEventListener('click', async () => {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      const isOneTime = document.getElementById('onetime-checkbox').checked;

      if ((!text && !attachedFileBase64) || !currentDmRef || !activeSharedKey) return;

      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
      const timestamp = Date.now();
      const roomId = [myUsername, activeTargetUser].sort().join('___');

      try {
        if (currentMode === "edit" && editingMessageId) {
          const snap = await currentDmRef.child(editingMessageId).once('value');
          if (snap.exists()) {
            const oldEnc = snap.val().ciphertext;
            const oldJson = JSON.parse(await decryptText(oldEnc, activeSharedKey));

            const updatedPayload = JSON.stringify({
              ...oldJson,
              text: text,
              edited: true
            });
            const newEncrypted = await encryptText(updatedPayload, activeSharedKey);
            await currentDmRef.child(editingMessageId).set({ ciphertext: newEncrypted });
          }
        } else {
          const payloadObj = {
            sender: myUsername,
            text: text,
            file: attachedFileBase64 || null,
            time: timeStr,
            timestamp: timestamp,
            expiry: currentTimerMs,
            onetime: isOneTime,
            edited: false
          };

          if (currentMode === "reply" && activeReplyData) {
            payloadObj.replyTo = activeReplyData;
          }

          const encrypted = await encryptText(JSON.stringify(payloadObj), activeSharedKey);
          await currentDmRef.push({ ciphertext: encrypted });

          // もし宛先がボットだったら自動返信トリガーを起動
          if (activeTargetUser === BOT_USERNAME) {
            triggerBotReply(roomId, text || '[画像]', isOneTime);
          } else {
            try {
              await db.ref(`users/${activeTargetUser}/inbox/${myUsername}`).set(true);
            } catch (inboxErr) {}
          }
        }

        document.getElementById('onetime-checkbox').checked = false;
        cancelMode();
      } catch (e) {
        alert("送信失敗: " + (e.message || e));
      }
    });
  </script>
</body>
