<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APURE Realtime Chat</title>
  <style>
    :root {
      --bg-dark: #100505;
      --bg-panel: #1b0a0a;
      --bg-msg: #2a0f0f;
      --accent-red: #8b0000;
      --text-main: #f0f0f0;
      --text-muted: #a08080;
      --border-color: #3d1414;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .chat-container {
      background-color: var(--bg-panel);
      width: 100%;
      max-width: 500px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .chat-header {
      padding: 16px;
      background-color: var(--bg-dark);
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
      text-align: center;
      color: #ff4d4d;
      font-size: 14px;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--accent-red);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .message-content { flex: 1; }

    .message-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .username {
      font-weight: bold;
      font-size: 14px;
      color: #ff8080;
    }

    .timestamp {
      font-size: 11px;
      color: var(--text-muted);
    }

    .message-body {
      background-color: var(--bg-msg);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid var(--border-color);
    }

    .chat-input-area {
      padding: 12px;
      background-color: var(--bg-dark);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input, textarea, button {
      width: 100%;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }

    textarea { height: 60px; resize: none; }

    button {
      background-color: var(--accent-red);
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>

  <!-- Firebase SDK の読み込み -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      APURE Realtime Encrypted Chat
    </div>

    <div class="chat-messages" id="message-list">
      <div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">
        共通パスワード（鍵）を入力するとメッセージが表示されます。
      </div>
    </div>

    <div class="chat-input-area">
      <div style="display: flex; gap: 8px;">
        <input type="text" id="user-input" placeholder="ユーザー名" value="И" style="flex: 1;">
        <input type="password" id="secret-key" placeholder="共通パスワード (必須)" style="flex: 1;">
      </div>
      <textarea id="msg-input" placeholder="メッセージを入力..."></textarea>
      <button id="send-btn" onclick="sendMessage()">送信</button>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------
    // Firebase設定（ここをご自身のFirebaseコンソールの値に置き換えてください）
    // -----------------------------------------------------------
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "apure-chat.firebaseapp.com",
      databaseURL: "https://apure-chat-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "apure-chat",
      storageBucket: "apure-chat.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 初期化
    let db, messagesRef;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      messagesRef = db.ref('chat_messages');
    } catch (e) {
      console.error("Firebase初期化エラー:", e);
    }

    // 2時間 (ミリ秒)
    const EXPIRE_MS = 2 * 60 * 60 * 1000;

    // -----------------------------------------------------------
    // 暗号化 / 復号化（Web Crypto API）
    // -----------------------------------------------------------
    async function getKeyMaterial(password) {
      const enc = new TextEncoder();
      return window.crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    }

    async function deriveKey(keyMaterial, salt) {
      return window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptText(text, password) {
      const enc = new TextEncoder();
      const salt = window.crypto.getRandomValues(new Uint8Array(16));
      const iv = window.crypto.getRandomValues(new Uint8Array(12));

      const keyMaterial = await getKeyMaterial(password);
      const key = await deriveKey(keyMaterial, salt);

      const encrypted = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        enc.encode(text)
      );

      const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
      combined.set(salt, 0);
      combined.set(iv, salt.length);
      combined.set(new Uint8Array(encrypted), salt.length + iv.length);

      return btoa(String.fromCharCode(...combined))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function decryptText(base64Data, password) {
      const base64 = base64Data.replace(/-/g, '+').replace(/_/g, '/');
      const str = atob(base64);
      const data = Uint8Array.from(str, c => c.charCodeAt(0));

      const salt = data.slice(0, 16);
      const iv = data.slice(16, 28);
      const ciphertext = data.slice(28);

      const keyMaterial = await getKeyMaterial(password);
      const key = await deriveKey(keyMaterial, salt);

      const decrypted = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        ciphertext
      );

      const dec = new TextDecoder();
      return dec.decode(decrypted);
    }

    // -----------------------------------------------------------
    // メッセージ送信処理
    // -----------------------------------------------------------
    async function sendMessage() {
      const user = document.getElementById('user-input').value || 'Anonymous';
      const text = document.getElementById('msg-input').value.trim();
      const password = document.getElementById('secret-key').value;
      const sendBtn = document.getElementById('send-btn');

      if (!password) {
        alert("共通パスワード（鍵）を入力してください。");
        return;
      }

      if (!text) {
        alert("メッセージを入力してください。");
        return;
      }

      if (!messagesRef) {
        alert("Firebaseの設定が正しく完了していません。設定値を確認してください。");
        return;
      }

      sendBtn.disabled = true;

      try {
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

        const payload = JSON.stringify({
          user,
          text,
          time: timeStr,
          createdAt: now.getTime()
        });

        const encryptedPayload = await encryptText(payload, password);

        await messagesRef.push({
          data: encryptedPayload,
          timestamp: now.getTime()
        });

        document.getElementById('msg-input').value = '';
      } catch (e) {
        alert("送信に失敗しました: " + e.message);
      } finally {
        sendBtn.disabled = false;
      }
    }

    // -----------------------------------------------------------
    // リアルタイム受信・描画処理
    // -----------------------------------------------------------
    function listenMessages() {
      if (!messagesRef) return;

      messagesRef.on('value', async (snapshot) => {
        const container = document.getElementById('message-list');
        const password = document.getElementById('secret-key').value;

        if (!password) {
          container.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">共通パスワード（鍵）を入力するとメッセージが表示されます。</div>';
          return;
        }

        const dataObj = snapshot.val();
        if (!dataObj) {
          container.innerHTML = '<div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px;">メッセージはまだありません。</div>';
          return;
        }

        container.innerHTML = '';
        const now = Date.now();

        for (const id in dataObj) {
          const item = dataObj[id];

          // 2時間以上前の古いデータを削除・非表示
          if (now - item.timestamp > EXPIRE_MS) {
            messagesRef.child(id).remove();
            continue;
          }

          try {
            const decryptedJson = await decryptText(item.data, password);
            const msg = JSON.parse(decryptedJson);

            const msgEl = document.createElement('div');
            msgEl.className = 'message-item';
            const initial = msg.user ? msg.user.charAt(0).toUpperCase() : '?';

            msgEl.innerHTML = `
              <div class="avatar">${initial}</div>
              <div class="message-content">
                <div class="message-meta">
                  <span class="username">${escapeHtml(msg.user)}</span>
                  <span class="timestamp">${msg.time}</span>
                </div>
                <div class="message-body">${escapeHtml(msg.text)}</div>
              </div>
            `;
            container.appendChild(msgEl);
          } catch (e) {
            // パスワード不一致等のデータは無視
          }
        }

        container.scrollTop = container.scrollHeight;
      });
    }

    // パスワード入力時、即座にメッセージを復号・再描写
    document.getElementById('secret-key').addEventListener('input', () => {
      if (messagesRef) messagesRef.once('value');
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    // 起動時に受信を開始
    listenMessages();
  </script>
</body>
</html>
